spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# JWT тестовые параметры
jwt.secret=test-super-secret-key-that-is-at-least-256-bits-long-hs256!
jwt.access-token-expiration-ms=60000
jwt.refresh-token-expiration-ms=600000

# Отключаем внешние OAuth2 клиенты в тестах (чтобы тесты не требовали реальных Google/GitHub/GitLab секретов)
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration