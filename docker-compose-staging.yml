services:
  postgres:
    image: postgres:16-alpine
    container_name: photogallery-staging-postgres
    environment:
      POSTGRES_DB: photogallery
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: demo
    container_name: photogallery-staging-app
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/photogallery
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: production-ci-super-secret-key-that-is-at-least-256-bits-long!
    depends_on:
      postgres:
        condition: service_healthy