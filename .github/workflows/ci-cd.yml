name: Photo Gallery CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-unit-tests:
    name: 1. Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Unit Tests (JwtUtils & PhotoService)
        run: mvn test -Dtest=JwtUtilsTest,PhotoServiceTest

      - name: Package JAR Artifact
        run: mvn package -DskipTests

  integration-tests:
    name: 2. Integration Tests (PostgreSQL Testcontainers)
    needs: build-and-unit-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Full Integration Tests
        run: mvn test -Dtest=PhotoGalleryIntegrationTest

  deploy-staging:
    name: 3. Deploy to  Staging Environment
    needs: integration-tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Start Staging Containers
        run: |
          docker compose -f docker-compose.staging.yml up -d --build

      - name: Wait & Verify Health Check
        run: |
          echo "Ожидание запуска приложения..."
          timeout 60 bash -c 'until curl -s http://localhost:8080/actuator/health | grep "UP"; do sleep 3; done'
          echo "Staging стенд успешно развернут и статус приложения: UP!"

      - name: Stop Staging Containers
        if: always()
        run: docker compose -f docker-compose.staging.yml down

  deploy-production:
    name: 4. Production Release
    needs: deploy-staging
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Announce Release
        run: |
          echo "Все тесты успешно пройдены!"
          echo "Приложение готово к продакшну. Release Tag: v1.0.${{ github.run_number }}"