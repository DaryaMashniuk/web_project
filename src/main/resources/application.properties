spring.application.name=photo-gallery

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/photogallery
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# OpenAPI / Swagger
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

# === 1. Google OAuth2 ===
spring.security.oauth2.client.registration.google.client-id=${CLIENT_ID_GOOGLE:dummy-google-id}
spring.security.oauth2.client.registration.google.client-secret=${CLIENT_SECRET_GOOGLE:dummy-google-secret}
spring.security.oauth2.client.registration.google.scope[0]=profile
spring.security.oauth2.client.registration.google.scope[1]=email
# === 2. GitHub OAuth2 ===
spring.security.oauth2.client.registration.github.client-id=${CLIENT_ID_GITHUB:dummy-github-id}
spring.security.oauth2.client.registration.github.client-secret=${CLIENT_SECRET_GITHUB:dummy-github-secret}

spring.security.oauth2.client.registration.github.scope[0]=read:user
spring.security.oauth2.client.registration.github.scope[1]=user:email
# === 3. GitLab OAuth2 ===
spring.security.oauth2.client.registration.gitlab.client-id=${CLIENT_ID_GITLAB:dummy-gitlab-id}
spring.security.oauth2.client.registration.gitlab.client-secret=${CLIENT_SECRET_GITLAB:dummy-gitlab-secret}
spring.security.oauth2.client.registration.gitlab.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.gitlab.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.gitlab.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.gitlab.scope[0]=read_user
spring.security.oauth2.client.registration.gitlab.client-name=GitLab

spring.security.oauth2.client.provider.gitlab.authorization-uri=https://gitlab.com/oauth/authorize
spring.security.oauth2.client.provider.gitlab.token-uri=https://gitlab.com/oauth/token
spring.security.oauth2.client.provider.gitlab.user-info-uri=https://gitlab.com/api/v4/user
spring.security.oauth2.client.provider.gitlab.user-name-attribute=username

# JWT Configuration
jwt.secret=super-secret-key-that-is-at-least-256-bits-long-for-hs256!
jwt.access-token-expiration-ms=900000
# 15 минут = 900 000 мс
jwt.refresh-token-expiration-ms=604800000
# 7 дней = 604 800 000 мс

# Мониторинг ключевых показателей
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.health.db.enabled=true
spring.docker.compose.file=C:/Users/user/Downloads/web/demo/docker-compose.yml